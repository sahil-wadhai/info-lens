spring:

  profile:
    active: dev

  application:
    name: infoLens

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    secret: mysupersecurelongsecretkeywith32chars
    expiration: 3600000 #1 hour

  refresh-token:
    expiration: 604800000 #7days
    token-store: database